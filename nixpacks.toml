[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "vips", "pkg-config", "zlib"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "LD_LIBRARY_PATH=$(find /nix/store -maxdepth 3 -name 'libz.so.1' -exec dirname {} \\; 2>/dev/null | head -1):$LD_LIBRARY_PATH node server.js"
