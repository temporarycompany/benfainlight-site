[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "vips", "pkg-config"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "LD_LIBRARY_PATH=/nix/store/ybjcla5bhj8g1y84998pn4a2drfxybkv-gcc-13.3.0-lib/lib:/nix/store/bzk3q2l71qwhycsip23y6rl5n881la4n-zlib-1.3.1/lib:$LD_LIBRARY_PATH node server.js"
